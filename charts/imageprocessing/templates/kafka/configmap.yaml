apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-config
  namespace: imageprocessing
data:
  KAFKA_NODE_ID: "1"
  KAFKA_PROCESS_ROLES: "broker,controller"
  KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
  # Stable DNS name provided by the headless Service + StatefulSet (see service.yml).
  # With 1 replica this always resolves to kafka-0.
  KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka-0.kafka.imageprocessing.svc.cluster.local:9092"
  KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
  KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka-0.kafka.imageprocessing.svc.cluster.local:9093"
  # Topics are created explicitly by the init Job below rather than relying on
  # auto-create, so partition count/replication is deliberate in prod.
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: {{ .Values.kafka.autoCreateTopicsEnable | quote }} 
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: {{ .Values.kafka.offsetsTopicReplicationFactor | quote }} 

