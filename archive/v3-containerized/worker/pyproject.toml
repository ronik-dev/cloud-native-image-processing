[project]
name = "worker"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.136.3",
    "ffmpeg-python>=0.2.0",
    "pillow>=12.2.0",
    "python-dotenv>=1.2.2",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "rembg[cpu]>=2.0.76",
    "transformers>=5.12.1",
    "uvicorn>=0.49.0",
    "timm>=1.0.27",
]

[dependency-groups]
dev = [
    "httpx2>=2.4.0",
    "pytest>=9.1.0",
]

[[tool.uv.index]]
url = "https://download.pytorch.org/whl/cpu"
name = "pytorch-cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
