apiVersion: v1
kind: PersistentVolume
metadata:
  name: pv-shared-storage
spec:
  storageClassName: {{ .Values.storage.sharedStorage.storageClassName | quote }}
  capacity:
    storage: {{ .Values.storage.sharedStorage.size | quote }}
  accessModes:
    - ReadWriteOnce
  hostPath:
    path: {{ .Values.storage.sharedStorage.hostPath | quote }}
