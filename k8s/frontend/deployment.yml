apiVersion: apps/v1
kind: Deployment 
metadata:
  name: frontend
  namespace: imageprocessing
  labels:
    app: frontend
    layer: web
spec:
  replicas: 1 #(default: 1)
  minReadySeconds: 0 #(default: 0)
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
      annotations:
        proxy.istio.io/config: |
          proxyMetadata:
            SECRET_TTL: "4h"
        sidecar.istio.io/proxyCPU: "50m"
        sidecar.istio.io/proxyCPULimit: "200m"
        sidecar.istio.io/proxyMemory: "128Mi"
        sidecar.istio.io/proxyMemoryLimit: "256Mi"
    spec:
      imagePullSecrets:
        - name: gitlab-registry-secret
      containers:
        - name: frontend
          image: gitlab-edu.supsi.ch:5050/dti-isin/roberto.guidi/didattica/progetti-semestre-diploma/cloud-native-image-processing/frontend:feature-85-install-and-configure-istio
          imagePullPolicy: IfNotPresent
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 5  
            periodSeconds: 10        
            timeoutSeconds: 5        
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 20  
            periodSeconds: 10        
            timeoutSeconds: 5        
            failureThreshold: 3
          envFrom:
            - configMapRef:
                name: frontend-config
            - secretRef:
                name: gateway-oauth2-secret
          env:
            - name: SERVER_TOMCAT_KEEP_ALIVE_TIMEOUT
              value: "3600000" # 1 hour in milliseconds
            - name: SERVER_TOMCAT_MAX_KEEP_ALIVE_REQUESTS
              value: "-1"
