# One-shot Job to create topics explicitly with a deliberate partition count,
# instead of relying on auto-create. Re-running is safe: --if-not-exists is a
# no-op on topics that already exist.
apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-create-topics
  namespace: imageprocessing
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: create-topics
          image: apache/kafka:3.9.0
          command:
            - /bin/bash
            - -c
            - |
              echo "Waiting for Kafka broker to be ready..."
              until /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list; do
                echo "Kafka is not ready yet, retrying in 3 seconds..."
                sleep 3
              done
              echo "Kafka is ready! Creating topics..."
              /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 \
                --create --if-not-exists --topic job.requests --partitions 3 --replication-factor 1
              /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 \
                --create --if-not-exists --topic job.results --partitions 3 --replication-factor 1
              echo "Topics created successfully."
