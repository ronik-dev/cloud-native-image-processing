[project]
name = "worker"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.136.3",
    "ffmpeg-python>=0.2.0",
    "python-dotenv>=1.2.2",
    "rembg[cpu]>=2.0.76",
    "uvicorn>=0.49.0",
]
[dependency-groups]
dev = [
    "httpx2>=2.4.0",
    "pytest>=9.1.0",
]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
