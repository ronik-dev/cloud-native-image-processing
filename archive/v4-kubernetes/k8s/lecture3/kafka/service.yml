apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: imageprocessing
spec:
  # Headless: required both for the StatefulSet's stable pod DNS
  # (kafka-0.kafka...) and so KRaft's controller quorum voter address resolves.
  # Clients (orchestrator, worker) still just point at "kafka:9092" with a
  # single replica that name resolves the same way a normal ClusterIP would.
  clusterIP: None
  selector:
    app: kafka
  ports:
    - name: broker
      port: 9092
      targetPort: 9092
    - name: controller
      port: 9093
      targetPort: 9093
