apiVersion: v1
kind: Pod
metadata:
  name: frontend
  namespace: imageprocessing
spec:
  containers:
    - name: frontend
      image: imageprocessing/frontend:latest
      imagePullPolicy: Never
      envFrom:
        - configMapRef:
            name: frontend-config
      readinessProbe:
        httpGet:
          path: /actuator/health
          port: 8080
        initialDelaySeconds: 5
        periodSeconds: 10
      livenessProbe:
        httpGet:
          path: /actuator/health
          port: 8080
        initialDelaySeconds: 20
        periodSeconds: 10
