apiVersion: v1
kind: Pod
metadata:
  name: postgres
  namespace: imageprocessing
spec:
  containers:
  - name: postgres
    image: postgres:18-alpine
    imagePullPolicy: Never
    envFrom:
      - secretRef:
          name: postgres-secret
      - configMapRef:
          name: postgres-config
    volumeMounts:
      - name: postgres-data
        mountPath: /var/lib/postgresql
    readinessProbe:
      exec:
        command: ["sh", "-c", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
    livenessProbe:
      exec:
        command: ["sh", "-c", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      initialDelaySeconds: 60
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
  volumes:
    - name: postgres-data
      emptyDir: {} # Still emptyDir since no PVC was defined for postgres in Lecture 3 source, it used a volumeClaimTemplate in the StatefulSet.
