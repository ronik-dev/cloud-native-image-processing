# .gitlab-ci.yml
#
# Scope of this draft: TEST stage only (closes #57 java tests, #58 python tests).
# BUILD (image build/push, #59) and DEPLOY (#55) stages are intentionally left
# out for now; add them as separate stages below once #59 is picked up.
stages:
  - test

# ---------------------------------------------------------------------------
# Shared config
# ---------------------------------------------------------------------------
default:
  tags:
    - linux
    - docker

workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH == "feature/79-add-test-containers"'
    - if: '$CI_COMMIT_BRANCH == "dev"'
    - if: '$CI_COMMIT_BRANCH == "main"'
 
# ---------------------------------------------------------------------------
# Java unit tests (common, orchestrator, gateway; multi-module reactor build)
# ---------------------------------------------------------------------------
java-tests:
  stage: test
  image: maven:3.9.16-eclipse-temurin-21-alpine
  variables:
    # Keep the local repo inside the job workspace so GitLab's cache can pick it up
    MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
    MAVEN_CLI_OPTS: "--batch-mode --errors --fail-at-end --show-version"
  cache:
    key:
      files:
        - pom.xml
    paths:
      - .m2/repository
  coverage: '/(\d+\.\d+)% covered/'
  script:
    - mvn $MAVEN_CLI_OPTS test
    - mvn $MAVEN_CLI_OPTS org.jacoco:jacoco-maven-plugin:0.8.15:report
    - >
      find . -name jacoco.csv -path "*/target/site/jacoco/*" -exec cat {} + |
      awk -F',' '
        NR>1 { missed += $4; covered += $5 }
        END { total = missed + covered;
              pct = (total > 0) ? 100 * covered / total : 0;
              printf "%.2f%% covered (%d/%d instructions)\n", pct, covered, total }
      '
  artifacts:
    when: always
    reports:
      junit:
        - "*/target/surefire-reports/TEST-*.xml"
    paths:
      - "*/target/site/jacoco/"
    expire_in: 1 week

# ---------------------------------------------------------------------------
# Integration tests (Testcontainers -- real Postgres, orchestrator only)
# ---------------------------------------------------------------------------
# Requires the runner to expose Docker access to the job (bind-mounted
# /var/run/docker.sock or an equivalent dind setup) -- not something this
# file controls. If this job fails with a Testcontainers "Could not find a
# valid Docker environment" error, that's a runner-config question, not a
# pipeline bug -- flag it to whoever administers the runner.
integration-tests:
  stage: test
  allow_failure: true
  image: maven:3.9.16-eclipse-temurin-21-alpine
  variables:
    MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
    MAVEN_CLI_OPTS: "--batch-mode --errors --fail-at-end --show-version"
  cache:
    key:
      files:
        - pom.xml
    paths:
      - .m2/repository
  before_script:
    # Cheap sanity check before Testcontainers gets a chance to fail with a
    # less obvious stack trace -- doesn't guarantee the daemon is reachable,
    # just that the socket file made it into the container at all.
    - '[ -S /var/run/docker.sock ] && echo "docker socket present" || echo "WARNING: /var/run/docker.sock not found -- Testcontainers will likely fail"'
  script:
    # -pl orchestrator -am: only orchestrator has IT tests, -am pulls in
    # common as a reactor dependency. -Dsurefire.skip=true skips re-running
    # the unit tests already covered by java-tests -- only Failsafe's *IT.java
    # tests execute here.
    - mvn $MAVEN_CLI_OPTS -pl orchestrator -am verify -Dsurefire.skip=true
  artifacts:
    when: always
    reports:
      junit:
        - "orchestrator/target/failsafe-reports/TEST-*.xml"
    expire_in: 1 week

# ---------------------------------------------------------------------------
# Python unit tests (worker)
# ---------------------------------------------------------------------------
python-tests:
  stage: test
  image: python:3.13-slim
  variables:
    UV_CACHE_DIR: "$CI_PROJECT_DIR/.uv-cache"
  cache:
    key:
      files:
        - worker/uv.lock
    paths:
      - .uv-cache
  before_script:
    - pip install --no-cache-dir uv
  coverage: '/^TOTAL.*\s+(\d+\%)$/'
  script:
    - cd worker
    - uv sync
    - uv run pytest test/ -v --junitxml=../report.xml --cov=main --cov-report=term --cov-report=xml:../coverage.xml
  artifacts:
    when: always
    reports:
      junit: report.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    expire_in: 1 week
