apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: imageprocessing
  labels:
    app: postgres 
    layer: data
spec:
  selector:
    matchLabels:
      app: postgres
  serviceName: "postgres"
  replicas: 1 #(default: 1)
  minReadySeconds: 0 #(default: 0)
  template:
    metadata:
      labels:
        app: postgres
    spec:
      terminationGracePeriodSeconds: 60
      containers:
      - name: postgres
        image: postgres:18-alpine
        imagePullPolicy: Always
        volumeMounts:
          - name: postgres-data
            mountPath: /var/lib/postgresql
        readinessProbe:
          exec:
            command:
              - sh
              - -c 
              - "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
          initialDelaySeconds: 10  
          periodSeconds: 10        
          timeoutSeconds: 5        
          failureThreshold: 3
        livenessProbe:
          exec:
            command:
              - sh
              - -c 
              - "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
          initialDelaySeconds: 60  
          periodSeconds: 10        
          timeoutSeconds: 5        
          failureThreshold: 3
        envFrom:
          - secretRef:
              name: postgres-secret
          - configMapRef:
              name: postgres-config
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
